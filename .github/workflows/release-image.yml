name: release-image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/snowballsh/portfolio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="${GITHUB_SHA}" \
            -f Containerfile \
            -t "${IMAGE}:sha-${GITHUB_SHA}" .

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Record the registry digest
        if: github.event_name != 'pull_request'
        run: |
          token="$(curl -fs 'https://ghcr.io/token?scope=repository:snowballsh/portfolio:pull' | jq -r .token)"
          digest="$(curl -fsI \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/snowballsh/portfolio/manifests/sha-${GITHUB_SHA}" |
            awk 'tolower($1)=="docker-content-digest:" {print $2}' | tr -d '\r')"
          {
            echo "### Portfolio image"
            echo ""
            echo '```'
            echo "ghcr.io/snowballsh/portfolio@${digest}"
            echo '```'
            echo ""
            echo "Built from commit ${GITHUB_SHA}. Pin this digest in the next deployment bundle revision."
          } >> "${GITHUB_STEP_SUMMARY}"
